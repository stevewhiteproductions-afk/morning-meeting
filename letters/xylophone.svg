<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98b4a"/><stop offset="1" stop-color="#8a5326"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9c48f"/><stop offset="1" stop-color="#b9864a"/>
    </linearGradient>
    <radialGradient id="ballR" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#c62828"/></radialGradient>
    <radialGradient id="ballB" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#90caf9"/><stop offset="1" stop-color="#1565c0"/></radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- frame rails -->
    <path d="M38 118 L322 92 L328 112 L42 140 Z" fill="url(#wood)"/>
    <path d="M44 228 L326 196 L332 216 L48 250 Z" fill="url(#wood)"/>
    <!-- bars: long on the left, short on the right -->
    <g stroke="#00000033" stroke-width="2">
      <rect x="44"  y="86"  width="30" height="178" rx="10" fill="#e53935"/>
      <rect x="82"  y="88"  width="30" height="168" rx="10" fill="#fb8c00"/>
      <rect x="120" y="90"  width="30" height="158" rx="10" fill="#fdd835"/>
      <rect x="158" y="92"  width="30" height="148" rx="10" fill="#43a047"/>
      <rect x="196" y="94"  width="30" height="138" rx="10" fill="#00acc1"/>
      <rect x="234" y="96"  width="30" height="128" rx="10" fill="#1e88e5"/>
      <rect x="272" y="98"  width="30" height="118" rx="10" fill="#8e24aa"/>
    </g>
    <g fill="url(#shine)">
      <rect x="44"  y="86"  width="30" height="178" rx="10"/>
      <rect x="82"  y="88"  width="30" height="168" rx="10"/>
      <rect x="120" y="90"  width="30" height="158" rx="10"/>
      <rect x="158" y="92"  width="30" height="148" rx="10"/>
      <rect x="196" y="94"  width="30" height="138" rx="10"/>
      <rect x="234" y="96"  width="30" height="128" rx="10"/>
      <rect x="272" y="98"  width="30" height="118" rx="10"/>
    </g>
    <!-- nails -->
    <g fill="#5d4037">
      <circle cx="59" cy="124" r="4"/><circle cx="97" cy="121" r="4"/><circle cx="135" cy="118" r="4"/><circle cx="173" cy="115" r="4"/><circle cx="211" cy="112" r="4"/><circle cx="249" cy="109" r="4"/><circle cx="287" cy="106" r="4"/>
      <circle cx="59" cy="240" r="4"/><circle cx="97" cy="236" r="4"/><circle cx="135" cy="232" r="4"/><circle cx="173" cy="227" r="4"/><circle cx="211" cy="222" r="4"/><circle cx="249" cy="216" r="4"/><circle cx="287" cy="210" r="4"/>
    </g>
    <!-- mallets -->
    <g transform="translate(-30 4)">
    <g transform="rotate(-35 250 34)">
      <rect x="244" y="36" width="12" height="150" rx="6" fill="url(#stick)"/>
      <circle cx="250" cy="34" r="22" fill="url(#ballR)"/>
    </g>
    <g transform="rotate(35 300 46)">
      <rect x="294" y="48" width="12" height="150" rx="6" fill="url(#stick)"/>
      <circle cx="300" cy="46" r="22" fill="url(#ballB)"/>
    </g>
    </g>
  </g>
</svg>
